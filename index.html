<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習メモリー</title>
<style>
:root{
  --bg:#0f0a19;--card:#1a1328;--card2:#24183a;--line:#6d28d9;
  --text:#f3e8ff;--sub:#d8b4fe;--muted:#c4b5fd;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,#7c3aed,#a855f7,#ec4899);color:white;padding:20px 16px;text-align:center;}
header h1{margin:0 0 6px;font-size:26px;} header p{margin:0;color:#fdf4ff;}
main{max-width:820px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid rgba(216,180,254,.25);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 18px rgba(0,0,0,.22);}
h2{margin-top:0;font-size:20px;} h3{margin-bottom:8px;}
label{display:block;font-size:14px;margin-top:10px;color:var(--sub);}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;}
input::placeholder,textarea::placeholder{color:#9f8bc8;}
button{border:none;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;font-weight:bold;margin-top:14px;cursor:pointer;}
button.secondary{background:#7c3aed;} button.danger{background:#9333ea;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;}
.stat{background:linear-gradient(135deg,#2e1f46,#3b2459);padding:12px;border-radius:14px;border:1px solid rgba(216,180,254,.22);min-height:58px;}
.stat strong{display:block;font-size:22px;margin-bottom:4px;color:#f5d0fe;}
.stat span{font-size:12px;color:var(--muted);}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:bold;font-size:13px;margin:4px 0 10px;}
.progress-wrap{background:#21172f;border-radius:999px;overflow:hidden;border:1px solid var(--line);height:18px;margin-top:8px;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#ec4899);}
.message{background:#2e1f46;color:#f5d0fe;padding:10px;border-radius:10px;margin-top:10px;display:none;border:1px solid var(--line);}
.note{color:var(--muted);font-size:13px;line-height:1.5;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;}
.day{aspect-ratio:1/1;border-radius:8px;background:#21172f;border:1px solid rgba(216,180,254,.15);display:flex;align-items:center;justify-content:center;font-size:10px;color:#a78bfa;}
.lv1{background:#3b2459}.lv2{background:#5b21b6}.lv3{background:#9333ea}.lv4{background:#db2777;color:white}
.ranking-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
.ranking-label{width:44%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ranking-bar-bg{flex:1;background:#21172f;height:12px;border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.ranking-bar{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);}
.ranking-min{width:54px;text-align:right;color:var(--sub);font-size:13px;}
.log{border-top:1px solid var(--line);padding:10px 0;font-size:14px;}
.log small{color:var(--muted);}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.ranking-label{width:42%;}}
</style>
</head>
<body>
<header><h1>学習メモリー</h1><p>積み上げを見える化して、学習意欲を育てる</p></header>
<main>
<section class="card">
<h2>今日の学習を記録</h2>
<label>学習日</label><input type="date" id="date">
<label>学習テーマ（大項目）</label>
<select id="category">
<option value="グロービスGMAP">グロービスGMAP</option>
<option value="さくらのAI検定">さくらのAI検定</option>
<option value="AIツール勉強">AIツール勉強</option>
</select>
<label>中項目</label><input type="text" id="subject" placeholder="例：ファイナンス、マーケティング、ChatGPT活用">
<label>学習時間（分）</label><input type="number" id="minutes" placeholder="例：30" min="1">
<label>理解度</label>
<select id="level">
<option value="◎ よく理解できた">◎ よく理解できた</option>
<option value="○ だいたい理解">○ だいたい理解</option>
<option value="△ 復習が必要">△ 復習が必要</option>
</select>
<label>メモ</label><textarea id="memo" rows="3" placeholder="例：NPVの割引計算で迷った"></textarea>
<button id="saveButton" type="button">記録する</button>
<div id="message" class="message"></div>
</section>

<section class="card">
<h2>学習ステータス</h2>
<div id="badge" class="badge">BRONZE</div>
<div class="stats">
<div class="stat"><strong id="todayTotal">0</strong><span>今日 分</span></div>
<div class="stat"><strong id="weekTotal">0</strong><span>7日間 分</span></div>
<div class="stat"><strong id="monthTotal">0</strong><span>今月 分</span></div>
<div class="stat"><strong id="totalHours">0.0</strong><span>累計 時間</span></div>
<div class="stat"><strong id="streak">0</strong><span>連続 日</span></div>
<div class="stat"><strong id="bestStreak">0</strong><span>最長連続 日</span></div>
<div class="stat"><strong id="studyDays">0</strong><span>学習日数</span></div>
<div class="stat"><strong id="recordCount">0</strong><span>記録数</span></div>
</div>
<h3>GMAP目標進捗</h3>
<div class="note">目標：300時間。あと <strong id="remainHours">300.0</strong> 時間</div>
<div class="progress-wrap"><div id="goalProgress" class="progress-bar"></div></div>
<div class="note" id="goalText">0%</div>
</section>

<section class="card"><h2>学習カレンダー</h2><div class="note">直近35日。濃いほど学習時間が多い日です。</div><div id="calendar" class="calendar"></div></section>
<section class="card"><h2>科目別ランキング</h2><h3>大項目</h3><div id="categoryRanking"></div><h3>中項目</h3><div id="subjectRanking"></div></section>
<section class="card"><h2>最近の記録</h2><div id="records"></div><button class="secondary" type="button" id="csvButton">CSVで出力</button><button class="danger" type="button" id="clearButton">全データ削除</button></section>
</main>

<script>
var STORAGE_KEY="study_memory_records_v1";
var GMAP_GOAL_HOURS=300;
function pad2(n){return String(n).padStart(2,"0")}
function formatDate(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function todayKey(){return formatDate(new Date())}
function daysAgoKey(n){var d=new Date();d.setDate(d.getDate()-n);return formatDate(d)}
function loadRecords(){try{var data=localStorage.getItem(STORAGE_KEY);if(!data)return[];var arr=JSON.parse(data);if(!Array.isArray(arr))return[];return arr.map(function(r){r.category=r.category||"未分類";r.subject=r.subject||"未入力";r.minutes=Number(r.minutes||0);return r})}catch(e){return[]}}
function saveRecords(records){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function addRecord(){
var date=document.getElementById("date").value;
var category=document.getElementById("category").value;
var subject=document.getElementById("subject").value.trim();
var minutes=Number(document.getElementById("minutes").value);
var level=document.getElementById("level").value;
var memo=document.getElementById("memo").value.trim();
if(!date||!subject||!minutes||minutes<=0){alert("学習日・中項目・学習時間を入力してください。");return}
var records=loadRecords();
records.push({date:date,category:category,subject:subject,minutes:minutes,level:level,memo:memo,createdAt:new Date().getTime()});
saveRecords(records);
document.getElementById("subject").value="";
document.getElementById("minutes").value="";
document.getElementById("memo").value="";
render();
var msg=document.getElementById("message");
msg.textContent=motivationalMessage(loadRecords());
msg.style.display="block";
setTimeout(function(){msg.style.display="none"},2200)
}
function render(){
var records=loadRecords();
records.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return-1;return(b.createdAt||0)-(a.createdAt||0)});
var today=todayKey(),weekStart=daysAgoKey(6),monthPrefix=today.slice(0,7);
var todayTotal=sum(records.filter(function(r){return r.date===today}));
var weekTotal=sum(records.filter(function(r){return r.date>=weekStart}));
var monthTotal=sum(records.filter(function(r){return r.date.slice(0,7)===monthPrefix}));
var totalMin=sum(records),totalHours=totalMin/60;
setText("todayTotal",todayTotal);setText("weekTotal",weekTotal);setText("monthTotal",monthTotal);setText("totalHours",totalHours.toFixed(1));
setText("streak",calcStreak(records));setText("bestStreak",calcBestStreak(records));setText("studyDays",uniqueDateCount(records));setText("recordCount",records.length);
var percent=Math.min(100,(totalHours/GMAP_GOAL_HOURS)*100);
document.getElementById("goalProgress").style.width=percent+"%";
setText("remainHours",Math.max(0,GMAP_GOAL_HOURS-totalHours).toFixed(1));setText("goalText",percent.toFixed(1)+"% 達成");
renderBadge(totalHours);renderCalendar(records);renderRanking("categoryRanking",groupSum(records,"category"));renderRanking("subjectRanking",groupSum(records,"subject"));renderRecords(records)
}
function renderBadge(totalHours){var badge="BRONZE";if(totalHours>=100)badge="PLATINUM";else if(totalHours>=50)badge="GOLD";else if(totalHours>=30)badge="SILVER";else if(totalHours>=10)badge="BRONZE+";setText("badge",badge+"｜累計 "+totalHours.toFixed(1)+"時間")}
function renderCalendar(records){var byDate={};records.forEach(function(r){byDate[r.date]=(byDate[r.date]||0)+Number(r.minutes||0)});var cal=document.getElementById("calendar");cal.innerHTML="";for(var i=34;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var key=formatDate(d),min=byDate[key]||0;var div=document.createElement("div");div.className="day "+levelClass(min);div.title=key+"："+min+"分";div.textContent=d.getDate();cal.appendChild(div)}}
function levelClass(min){if(min>=90)return"lv4";if(min>=60)return"lv3";if(min>=30)return"lv2";if(min>0)return"lv1";return""}
function renderRanking(id,data){var area=document.getElementById(id);area.innerHTML="";var entries=Object.keys(data).map(function(k){return[k,data[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5);if(entries.length===0){area.innerHTML='<p class="note">まだデータがありません。</p>';return}var max=entries[0][1]||1;entries.forEach(function(item){var row=document.createElement("div");row.className="ranking-row";row.innerHTML='<div class="ranking-label">'+escapeHTML(item[0])+'</div><div class="ranking-bar-bg"><div class="ranking-bar" style="width:'+((item[1]/max)*100)+'%"></div></div><div class="ranking-min">'+item[1]+'分</div>';area.appendChild(row)})}
function renderRecords(records){var list=document.getElementById("records");list.innerHTML="";if(records.length===0){list.innerHTML='<p class="note">まだ記録がありません。</p>';return}records.slice(0,20).forEach(function(r){var div=document.createElement("div");div.className="log";div.innerHTML='<strong>'+escapeHTML(r.category)+'</strong> ＞ '+escapeHTML(r.subject)+'：'+r.minutes+'分<br><small>'+r.date+' / '+escapeHTML(r.level)+'</small><br>'+(r.memo?escapeHTML(r.memo):"");list.appendChild(div)})}
function calcStreak(records){var dates={};records.forEach(function(r){dates[r.date]=true});var count=0,d=new Date();while(true){var key=formatDate(d);if(dates[key]){count++;d.setDate(d.getDate()-1)}else break}return count}
function calcBestStreak(records){var obj={};records.forEach(function(r){obj[r.date]=true});var dates=Object.keys(obj).sort();if(dates.length===0)return 0;var best=1,current=1;for(var i=1;i<dates.length;i++){var prev=parseDate(dates[i-1]),now=parseDate(dates[i]);var diff=Math.round((now-prev)/86400000);if(diff===1)current++;else current=1;if(current>best)best=current}return best}
function parseDate(str){var p=str.split("-");return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]))}
function motivationalMessage(records){var streak=calcStreak(records),totalHours=sum(records)/60;if(streak>=7)return"すごいです。7日以上の継続です。学習が習慣になっています。";if(streak>=3)return streak+"日連続です。かなり良いペースです。";if(totalHours>=10)return"累計10時間を超えました。積み上がっています。";return"記録しました。今日の一歩が次につながります。"}
function exportCSV(){var records=loadRecords();if(records.length===0){alert("出力するデータがありません。");return}var header=["date","category","subject","minutes","level","memo"];var rows=records.map(function(r){return header.map(function(h){return'"'+String(r[h]||"").replaceAll('"','""')+'"'}).join(",")});var csv=header.join(",")+"\n"+rows.join("\n");var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="study_memory.csv";a.click();URL.revokeObjectURL(url)}
function clearAll(){if(confirm("すべての記録を削除しますか？")){localStorage.removeItem(STORAGE_KEY);render()}}
function groupSum(records,key){var obj={};records.forEach(function(r){var name=r[key]||"未分類";obj[name]=(obj[name]||0)+Number(r.minutes||0)});return obj}
function sum(records){return records.reduce(function(s,r){return s+Number(r.minutes||0)},0)}
function uniqueDateCount(records){var obj={};records.forEach(function(r){obj[r.date]=true});return Object.keys(obj).length}
function setText(id,text){document.getElementById(id).textContent=text}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})}
document.addEventListener("DOMContentLoaded",function(){
document.getElementById("date").value=todayKey();
document.getElementById("saveButton").addEventListener("click",addRecord);
document.getElementById("csvButton").addEventListener("click",exportCSV);
document.getElementById("clearButton").addEventListener("click",clearAll);
render();
});
</script>
</body>
</html>
